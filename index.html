<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --accent: #3b82f6; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { background: var(--panel); padding: 20px; border-radius: 8px; width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px; }
        button { width: 100%; padding: 12px; background: var(--accent); border: none; color: white; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 快速開倉紀錄</h2>
    <div class="form-group">
        <label>合約標的</label>
        <input type="text" id="symbol" placeholder="例如: BTCUSDT">
    </div>
    <div class="form-group">
        <label>方向</label>
        <select id="direction">
            <option value="Long">做多 (Long)</option>
            <option value="Short">做空 (Short)</option>
        </select>
    </div>
    <div class="form-group">
        <label>進場價格 / 止損 / 止盈</label>
        <input type="number" id="entry" placeholder="進場價" style="margin-bottom:5px">
        <input type="number" id="sl" placeholder="止損價" style="margin-bottom:5px">
        <input type="number" id="tp" placeholder="止盈價">
    </div>
    <button onclick="saveTrade()">💾 儲存並紀錄</button>
</div>

<script>
    function saveTrade() {
        const trade = {
            id: Date.now(),
            symbol: document.getElementById('symbol').value,
            dir: document.getElementById('direction').value,
            entry: document.getElementById('entry').value,
            sl: document.getElementById('sl').value,
            tp: document.getElementById('tp').value,
            date: new Date().toLocaleString()
        };
        
        let trades = JSON.parse(localStorage.getItem('trading_master') || '[]');
        trades.unshift(trade);
        localStorage.setItem('trading_master', JSON.stringify(trades));
        alert('紀錄成功！');
        window.location.href = 'journal.html';
    }
</script>
</body>
</html>
