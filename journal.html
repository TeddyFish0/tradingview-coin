<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交易紀錄與復盤日誌 | 終極交易系統</title>
    <style>
        :root { --bg-color: #0f172a; --panel-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --accent-green: #10b981; --accent-red: #ef4444; --accent-blue: #3b82f6; --border-color: #334155; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* 頂部導航列 */
        header { margin-bottom: 20px; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .header-title { display: flex; align-items: center; font-size: 24px; font-weight: bold; }
        .nav-group { display: flex; gap: 10px; }
        .nav-btn { background: transparent; border: 1px solid var(--accent-blue); color: var(--accent-blue); padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .nav-btn.active, .nav-btn:hover { background: var(--accent-blue); color: white; }
        .btn-icon { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .btn-icon:hover { background: var(--border-color); color: var(--text-main); }

        /* 篩選器 */
        .filter-section { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .filter-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .filter-btn.active { background: var(--accent-blue); border-color: var(--accent-blue); color: white; }
        .filter-btn:hover:not(.active) { border-color: var(--text-muted); color: var(--text-main); }
        
        /* 日期選擇器 UI 優化 */
        .date-picker { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 5px 12px; border-radius: 20px; font-size: 14px; outline: none; cursor: pointer; }
        .date-picker:focus { border-color: var(--accent-blue); color: var(--text-main); }
        ::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }

        /* 統計卡片 (調整為 6 格) */
        .stats-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: var(--panel-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); text-align: center; }
        .stat-title { color: var(--text-muted); font-size: 13px; margin-bottom: 10px; }
        .stat-value { font-size: 24px; font-weight: bold; }
        .text-green { color: var(--accent-green); }
        .text-red { color: var(--accent-red); }

        /* 表格區塊 */
        .table-container { background: var(--panel-bg); border-radius: 8px; border: 1px solid var(--border-color); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 15px 20px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        th { color: var(--text-muted); font-weight: normal; }
        tr:last-child td { border-bottom: none; }
        .symbol-group { display: flex; flex-direction: column; font-weight: bold; }
        .dir-badge { font-size: 12px; margin-top: 4px; display: inline-block; padding: 2px 6px; border-radius: 4px; width: fit-content; font-weight: normal; }
        .dir-long { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); }
        .dir-short { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }
        .action-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .action-btn:hover { background: var(--border-color); color: var(--text-main); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-title">📋 交易紀錄與復盤日誌</div>
        <div class="nav-group">
            <button class="btn-icon">💾 匯出備份</button>
            <button class="btn-icon">📁 匯入備份</button>
            <a href="index.html" class="nav-btn">開倉計畫</a>
            <a href="journal.html" class="nav-btn active">復盤日誌</a>
            <a href="tools.html" class="nav-btn">交易工具箱</a>
        </div>
    </header>

    <div class="filter-section">
        <button class="filter-btn active" onclick="setFilter('all', this)">全部紀錄</button>
        <button class="filter-btn" onclick="setFilter('today', this)">當日</button>
        <button class="filter-btn" onclick="setFilter('7d', this)">最近 7 日</button>
        <button class="filter-btn" onclick="setFilter('31d', this)">最近 31 日</button>
        <input type="date" id="custom-date-picker" class="date-picker" onchange="setFilter('custom', this)">
    </div>

    <div class="stats-grid">
        <div class="stat-card"><div class="stat-title">已平倉筆數</div><div class="stat-value" id="stat-count">0</div></div>
        <div class="stat-card"><div class="stat-title">區間勝率</div><div class="stat-value" id="stat-winrate">0.0%</div></div>
        <div class="stat-card"><div class="stat-title">累計總收益 ($)</div><div class="stat-value text-green" id="stat-pnl-amt">+$0.00</div></div>
        <div class="stat-card"><div class="stat-title">累計總收益 (%)</div><div class="stat-value text-green" id="stat-pnl-pct">+0.00%</div></div>
        <div class="stat-card"><div class="stat-title">單筆最大虧損</div><div class="stat-value text-red" id="stat-max-loss">0.00%</div></div>
        <div class="stat-card"><div class="stat-title">累積總虧損 ($)</div><div class="stat-value text-red" id="stat-total-loss">-$0.00</div></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>日期時間</th>
                    <th>狀態</th>
                    <th>標的 / 方向</th>
                    <th>計畫盈虧比</th>
                    <th>實際盈虧(%)</th>
                    <th>實際盈虧($)</th>
                    <th>事前理由 / 事後復盤</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="journal-tbody">
                </tbody>
        </table>
    </div>
</div>

<script>
    let trades = JSON.parse(localStorage.getItem('trading_master')) || [];
    let currentFilter = 'all';
    let selectedCustomDate = '';

    // 初始化渲染
    window.onload = () => renderDashboard();

    function setFilter(filterType, el) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        
        if(filterType !== 'custom') {
            el.classList.add('active');
            document.getElementById('custom-date-picker').value = ''; // 清除自訂日期
            selectedCustomDate = '';
        } else {
            // 如果點擊了特定日期，移除所有按鈕的 active 狀態
            selectedCustomDate = el.value;
        }
        
        currentFilter = filterType;
        renderDashboard();
    }

    function renderDashboard() {
        let filteredTrades = trades;
        const now = new Date();
        const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

        // 執行篩選邏輯
        filteredTrades = trades.filter(trade => {
            // 將 trade.date (如 2026/6/11 19:53) 轉換為標準 YYYY-MM-DD
            let tradeDateStr = trade.date.split(' ')[0];
            let tDate = new Date(tradeDateStr);
            let formattedTradeDate = `${tDate.getFullYear()}-${String(tDate.getMonth()+1).padStart(2, '0')}-${String(tDate.getDate()).padStart(2, '0')}`;

            if (currentFilter === 'today') return formattedTradeDate === todayStr;
            if (currentFilter === '7d') return (now - tDate) / (1000 * 60 * 60 * 24) <= 7;
            if (currentFilter === '31d') return (now - tDate) / (1000 * 60 * 60 * 24) <= 31;
            if (currentFilter === 'custom' && selectedCustomDate) return formattedTradeDate === selectedCustomDate;
            
            return true; // 'all' 或未選擇日期
        });

        calculateAndRenderStats(filteredTrades);
        renderTable(filteredTrades);
    }

    function calculateAndRenderStats(filtered) {
        let closedTrades = filtered.filter(t => t.status === '已平倉' || t.pnlAmt !== null);
        let winCount = 0;
        let totalPnlAmt = 0;
        let totalPnlPct = 0;
        let maxLossPct = 0;
        let totalLossAmt = 0; // 新增：總虧損累加器

        closedTrades.forEach(t => {
            let pnl = parseFloat(t.pnlAmt || 0);
            let pct = parseFloat(t.pnlPct || 0);
            
            totalPnlAmt += pnl;
            totalPnlPct += pct;

            if (pnl > 0) winCount++;
            
            // 計算最大單筆虧損
            if (pct < 0 && pct < maxLossPct) maxLossPct = pct;
            
            // 新增：只累加虧損的單
            if (pnl < 0) totalLossAmt += Math.abs(pnl); 
        });

        let winRate = closedTrades.length > 0 ? ((winCount / closedTrades.length) * 100).toFixed(1) : 0;

        // 更新 DOM
        document.getElementById('stat-count').innerText = closedTrades.length;
        document.getElementById('stat-winrate').innerText = `${winRate}%`;
        
        let pnlAmtEl = document.getElementById('stat-pnl-amt');
        pnlAmtEl.innerText = totalPnlAmt >= 0 ? `+$${totalPnlAmt.toFixed(2)}` : `-$${Math.abs(totalPnlAmt).toFixed(2)}`;
        pnlAmtEl.className = `stat-value ${totalPnlAmt >= 0 ? 'text-green' : 'text-red'}`;

        let pnlPctEl = document.getElementById('stat-pnl-pct');
        pnlPctEl.innerText = totalPnlPct >= 0 ? `+${totalPnlPct.toFixed(2)}%` : `${totalPnlPct.toFixed(2)}%`;
        pnlPctEl.className = `stat-value ${totalPnlPct >= 0 ? 'text-green' : 'text-red'}`;

        document.getElementById('stat-max-loss').innerText = `${maxLossPct.toFixed(2)}%`;
        
        // 更新新增的累積總虧損
        document.getElementById('stat-total-loss').innerText = totalLossAmt > 0 ? `-$${totalLossAmt.toFixed(2)}` : '$0.00';
    }

    function renderTable(filtered) {
        const tbody = document.getElementById('journal-tbody');
        tbody.innerHTML = '';

        filtered.forEach(trade => {
            let pnlColor = trade.pnlAmt >= 0 ? 'text-green' : 'text-red';
            let pnlSign = trade.pnlAmt > 0 ? '+' : '';
            let dirClass = trade.dir === 'Long' || trade.dir === '多' ? 'dir-long' : 'dir-short';
            let dirText = trade.dir === 'Long' || trade.dir === '多' ? '📈 多' : '📉 空';
            
            // 若為剛開倉尚未平倉的狀態，給予預設顯示
            let displayPct = trade.pnlPct !== null ? `${pnlSign}${trade.pnlPct}%` : '-';
            let displayAmt = trade.pnlAmt !== null ? `${pnlSign}$${trade.pnlAmt}` : '-';
            let displayStatus = trade.status === 'Open' ? '持倉中' : trade.status;

            // 動態產生操作按鈕：持倉中才有「平倉」按鈕
            let actionButtons = '';
            if (trade.status === 'Open') {
                actionButtons += `<button class="action-btn" style="color: var(--accent-blue); border-color: var(--accent-blue); margin-right: 8px;" onclick="closeTrade(${trade.id})">平倉</button>`;
            }
            actionButtons += `<button class="action-btn" onclick="deleteTrade(${trade.id})">刪除</button>`;

            tbody.innerHTML += `
                <tr>
                    <td>${trade.date}</td>
                    <td>${displayStatus}</td>
                    <td>
                        <div class="symbol-group">
                            ${trade.symbol}
                            <span class="dir-badge ${dirClass}">${dirText}</span>
                        </div>
                    </td>
                    <td>${trade.rr || '-'}</td>
                    <td class="${trade.pnlPct !== null ? pnlColor : ''}">${displayPct}</td>
                    <td class="${trade.pnlAmt !== null ? pnlColor : ''}">${displayAmt}</td>
                    <td style="max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                        ${trade.notes ? `[復盤] ${trade.notes}` : `[復盤] 無`}
                    </td>
                    <td>${actionButtons}</td>
                </tr>
            `;
        });
    }

    // 補回平倉邏輯 (若你已有自定義平窗邏輯，請替換此函數內容)
    function closeTrade(id) {
        let pctInput = prompt('請輸入實際盈虧百分比 (%)，例如：10.5 或 -5.2');
        if (pctInput === null) return; // 按下取消
        
        let amtInput = prompt('請輸入實際盈虧金額 ($)，例如：15.5 或 -8.3');
        if (amtInput === null) return;

        let notesInput = prompt('請輸入事後復盤筆記 (選填)：', '');

        let index = trades.findIndex(t => t.id === id);
        if (index !== -1) {
            trades[index].status = '已平倉';
            trades[index].pnlPct = parseFloat(pctInput) || 0;
            trades[index].pnlAmt = parseFloat(amtInput) || 0;
            trades[index].notes = notesInput || '';
            
            // 儲存並重新渲染畫面
            localStorage.setItem('trading_master', JSON.stringify(trades));
            renderDashboard();
        }
    }
</script>

</body>
</html>
